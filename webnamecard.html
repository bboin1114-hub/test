<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 명함</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .business-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 25px;
            border: 5px solid #667eea;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            display: block;
        }

        .profile-image-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 25px;
            border: 5px solid #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .title {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .company-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 10px;
            object-fit: contain;
            background: #f5f5f5;
            padding: 10px;
        }

        .company-logo-placeholder {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 25px 0;
        }

        .contact-info {
            text-align: left;
            margin-top: 25px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: #555;
            font-size: 14px;
        }

        .contact-item i {
            width: 30px;
            color: #667eea;
            font-size: 18px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .social-link {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: transform 0.3s;
        }

        .social-link:hover {
            transform: scale(1.1);
        }

        .qr-code {
            margin-top: 25px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .qr-code img {
            max-width: 120px;
            height: auto;
            border-radius: 5px;
        }

        .qr-code-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            background: #e0e0e0;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
        }

        .image-slideshow {
            margin-top: 25px;
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            background: #f9f9f9;
        }

        .slide-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            z-index: 1;
            will-change: opacity, transform, filter;
            transition: opacity 0.4s ease-in-out;
        }

        .slide-image.active {
            opacity: 1;
            z-index: 2;
        }

        .slide-image.entering {
            z-index: 3;
        }

        /* 다양한 전환 효과들 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        .slide-left {
            animation: slideLeft 0.5s ease-in-out;
        }

        .slide-right {
            animation: slideRight 0.5s ease-in-out;
        }

        .slide-up {
            animation: slideUp 0.5s ease-in-out;
        }

        .slide-down {
            animation: slideDown 0.5s ease-in-out;
        }

        .zoom-in {
            animation: zoomIn 0.5s ease-in-out;
        }

        .zoom-out {
            animation: zoomOut 0.5s ease-in-out;
        }

        .rotate-in {
            animation: rotateIn 0.5s ease-in-out;
        }

        .flip-horizontal {
            animation: flipHorizontal 0.5s ease-in-out;
        }

        .flip-vertical {
            animation: flipVertical 0.5s ease-in-out;
        }

        .scale-up {
            animation: scaleUp 0.5s ease-in-out;
        }

        .blur-in {
            animation: blurIn 0.5s ease-in-out;
        }

        .slide-diagonal-tl {
            animation: slideDiagonalTL 0.5s ease-in-out;
        }

        .slide-diagonal-tr {
            animation: slideDiagonalTR 0.5s ease-in-out;
        }

        .spin-in {
            animation: spinIn 0.5s ease-in-out;
        }

        .bounce-in {
            animation: bounceIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideLeft {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideRight {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes zoomOut {
            from { transform: scale(1.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes rotateIn {
            from { transform: rotate(-180deg) scale(0.5); opacity: 0; }
            to { transform: rotate(0deg) scale(1); opacity: 1; }
        }

        @keyframes flipHorizontal {
            from { transform: rotateY(90deg); opacity: 0; }
            to { transform: rotateY(0deg); opacity: 1; }
        }

        @keyframes flipVertical {
            from { transform: rotateX(90deg); opacity: 0; }
            to { transform: rotateX(0deg); opacity: 1; }
        }

        @keyframes scaleUp {
            from { transform: scale(0.8) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes blurIn {
            from { filter: blur(10px); opacity: 0; }
            to { filter: blur(0); opacity: 1; }
        }

        @keyframes slideDiagonalTL {
            from { transform: translate(-100%, -100%); opacity: 0; }
            to { transform: translate(0, 0); opacity: 1; }
        }

        @keyframes slideDiagonalTR {
            from { transform: translate(100%, -100%); opacity: 0; }
            to { transform: translate(0, 0); opacity: 1; }
        }

        @keyframes spinIn {
            from { transform: rotate(360deg) scale(0); opacity: 0; }
            to { transform: rotate(0deg) scale(1); opacity: 1; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 480px) {
            .business-card {
                padding: 30px 20px;
            }

            .profile-image, .profile-image-placeholder {
                width: 120px;
                height: 120px;
            }

            .name {
                font-size: 24px;
            }

            .image-slideshow {
                height: 150px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="business-card">
        <!-- 프로필 이미지 -->
        <img src="https://images.unsplash.com/photo-1758565811272-e79917ca0adc?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1170" 
             alt="프로필 사진" 
             class="profile-image"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="profile-image-placeholder" style="display: none;">김보인</div>

        <!-- 이름과 직책 -->
        <div class="name">김보인</div>
        <div class="title">웹 개발자 | Full Stack Developer</div>

        <!-- 회사 로고 -->
        <img src="https://plus.unsplash.com/premium_photo-1751906599669-749526dd5a40?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=685" 
             alt="회사 로고" 
             class="company-logo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="company-logo-placeholder" style="display: none;">LOGO</div>

        <div class="divider"></div>

        <!-- 연락처 정보 -->
        <div class="contact-info">
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <span>contact@example.com</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-phone"></i>
                <span>010-1234-5678</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>서울특별시 강서구 마곡중앙로 165</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-globe"></i>
                <span>www.example.com</span>
            </div>
        </div>

        <!-- 소셜 링크 -->
        <div class="social-links">
            <a href="#" class="social-link" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="#" class="social-link" title="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="#" class="social-link" title="Email">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="#" class="social-link" title="Website">
                <i class="fas fa-globe"></i>
            </a>
        </div>

        <!-- QR 코드 -->
        <div class="qr-code">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=http%3A%2F%2F127.0.0.1%3A5500%2Fwebnamecard.html" 
                 alt="QR 코드"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="qr-code-placeholder" style="display: none;">QR Code</div>
        </div>

        <!-- 이미지 슬라이드 쇼 -->
        <div class="image-slideshow">
            <div class="slide-container" id="slideContainer">
                <!-- 이미지는 JavaScript로 동적으로 추가됩니다 -->
            </div>
        </div>
    </div>

    <script>
        // 이미지 주소 배열 (3개의 이미지 주소)
        // 첫 번째: https://images.unsplash.com/photo-1761839257845-9283b7d1b933?ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1170
        // 두 번째: https://images.unsplash.com/photo-1762656668994-57d8933d59dd?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=687
        // 세 번째: https://images.unsplash.com/photo-1762652847337-d0bb9764308b?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1171
        const images = [
            'https://images.unsplash.com/photo-1761839257845-9283b7d1b933?ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1170',
            'https://images.unsplash.com/photo-1762656668994-57d8933d59dd?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1170',
            'https://images.unsplash.com/photo-1762652847337-d0bb9764308b?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1171'
        ];

        // 다양한 전환 효과 배열
        const transitionEffects = [
            'fade-in',
            'slide-left',
            'slide-right',
            'slide-up',
            'slide-down',
            'zoom-in',
            'zoom-out',
            'rotate-in',
            'flip-horizontal',
            'flip-vertical',
            'scale-up',
            'blur-in',
            'slide-diagonal-tl',
            'slide-diagonal-tr',
            'spin-in',
            'bounce-in'
        ];

        let currentIndex = 0;
        const slideContainer = document.getElementById('slideContainer');

        // 이미지 요소들을 동적으로 생성
        images.forEach((imageSrc, index) => {
            const img = document.createElement('img');
            img.src = imageSrc;
            img.alt = `슬라이드 ${index + 1}`;
            img.className = 'slide-image';
            if (index === 0) {
                img.classList.add('active');
            }
            slideContainer.appendChild(img);
        });

        // 랜덤 효과 선택 함수
        function getRandomEffect() {
            return transitionEffects[Math.floor(Math.random() * transitionEffects.length)];
        }

        // 슬라이드 전환 함수
        function nextSlide() {
            const slides = document.querySelectorAll('.slide-image');
            const currentSlide = slides[currentIndex];
            
            // 다음 인덱스 계산
            const nextIndex = (currentIndex + 1) % images.length;
            const nextSlideElement = slides[nextIndex];
            
            // 랜덤 효과 선택
            const effect = getRandomEffect();
            
            // 다음 슬라이드를 먼저 준비: z-index를 높이고 active 클래스 추가
            nextSlideElement.classList.add('entering', effect, 'active');
            nextSlideElement.style.zIndex = '3';
            // 초기 상태를 투명하게 설정 (애니메이션 시작 전)
            nextSlideElement.style.opacity = '0';
            
            // 다음 프레임에서 동시에 페이드 인/아웃 시작 (빈틈 없이)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    // 다음 슬라이드 페이드 인 (위에 배치되어 있음)
                    nextSlideElement.style.opacity = '1';
                    // 현재 슬라이드 페이드 아웃
                    currentSlide.style.opacity = '0';
                });
            });
            
            // 전환 완료 후 정리
            setTimeout(() => {
                // 현재 슬라이드 완전히 숨기기
                currentSlide.classList.remove('active');
                currentSlide.style.opacity = '0';
                currentSlide.style.zIndex = '1';
                // 애니메이션 효과 초기화
                currentSlide.style.transform = '';
                currentSlide.style.filter = '';
                
                // 다음 슬라이드를 정상 상태로 변경
                nextSlideElement.classList.remove('entering', effect);
                nextSlideElement.style.zIndex = '2';
                nextSlideElement.style.opacity = '1';
                // 애니메이션 효과 초기화
                nextSlideElement.style.transform = '';
                nextSlideElement.style.filter = '';
                
                // 인덱스 업데이트
                currentIndex = nextIndex;
            }, 500);
        }

        // 1.5초마다 슬라이드 전환 (빠른 전환, 빈틈 없이)
        setInterval(nextSlide, 1500);

        // 이미지 로드 오류 처리
        document.querySelectorAll('.slide-image').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
            });
        });
    </script>
</body>
</html>
